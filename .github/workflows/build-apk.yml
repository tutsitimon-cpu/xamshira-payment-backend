name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK sozlash
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: NPM paketlarini o'rnatish
        run: npm install

      - name: Capacitor'ni Android bilan sinxronlash
        run: npx cap sync android

      - name: Gradlew'ga ishga tushirish huquqi berish
        run: chmod +x android/gradlew

      - name: Debug APK qurish
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK'ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: tibbiy-yordamchi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
